spring.application.name=namma-store-backend
server.port=${SERVER_PORT:8080}

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/namma_store_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Sampath@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Stops the "could not initialize proxy - no Session" surprises now that
# controllers map entities to DTOs inside the request instead of letting
# Jackson walk lazy associations during serialization.
spring.jpa.open-in-view=false

# ---- File uploads ----
# The admin UI uploads product / category / profile images through the API,
# which is what removes the manual pgAdmin image-URL workflow.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ---- Storage ----
# Leave storage.* blank to use local disk (./uploads), which is served at
# http://localhost:8080/uploads/**. Fill them in to switch to Cloudflare R2
# or any S3-compatible bucket. NOTHING here is hard-coded: set the matching
# environment variables instead of editing this file.
storage.endpoint=${STORAGE_ENDPOINT:}
storage.bucket=${STORAGE_BUCKET:}
storage.access.key=${STORAGE_ACCESS_KEY:}
storage.secret.key=${STORAGE_SECRET_KEY:}
# Optional public/CDN domain in front of the bucket (e.g. https://cdn.example.com)
storage.public.base-url=${STORAGE_PUBLIC_BASE_URL:}
# Local folder used when no bucket is configured.
storage.local.dir=${STORAGE_LOCAL_DIR:uploads}

# ---- App ----
# Public origin of THIS backend. Used to turn the relative image paths stored
# in PostgreSQL into absolute URLs the browser can load.
app.public.base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
# Origin allowed to call the API (the Next.js frontend).
app.cors.allowed-origin=${APP_CORS_ORIGIN:http://localhost:3000}

# ---- Delivery pricing (server-side; the client never sends a total) ----
app.delivery.charge=${APP_DELIVERY_CHARGE:49}
app.delivery.free-above=${APP_FREE_DELIVERY_ABOVE:499}

# ---- Razorpay (not wired up yet - Stage 4 uses a dummy payment flow) ----
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# ---- Firebase ----
# Set GOOGLE_APPLICATION_CREDENTIALS to the path of your service account JSON.
# Token verification is now REAL (FirebaseAuthService in Auth.java calls
# FirebaseAuth.verifyIdToken). Without credentials, /api/admin/** returns 401.
app.auth.allow-insecure-uid-fallback=${APP_AUTH_ALLOW_INSECURE_UID_FALLBACK:false}

# Banded delivery. Orders under the small-order threshold pay the small-order
# charge; orders at or above free-above ship free; everything between pays
# app.delivery.charge. Calculated server-side in OrdersController.priceCart.
app.delivery.small-order-threshold=${APP_SMALL_ORDER_THRESHOLD:200}
app.delivery.small-order-charge=${APP_SMALL_ORDER_CHARGE:40}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
